<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cookie Demo</title>
    <link rel="stylesheet" href="/style.css"/>
    <script src="/scripts/theme.js"></script>
</head>
<body>
    <h1>Cookie Demo</h1>
    <p id="status">Checking cookies...</p>
    <p id="visit-info"></p>
    <script>
        const cookies = document.cookie;
        document.getElementById('status').textContent = cookies ? `Cookies: ${cookies}` : 'No cookies set';
        const visits = getCookie('visit_count');
        if (visits) {
            document.getElementById('visit-info').textContent = `Visits so far: ${visits}`;
        }
    </script>
    <p><a href="/cgi-bin/cookie.py">Set a test cookie</a></p>
    <p><a href="/">Back to Home</a></p>
</body>
</html>
