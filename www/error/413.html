<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>413 - Payload Too Large</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/css/error.css">
</head>
<body class="error-413">
    <div class="error-container">
        <h1>413</h1>
        <div class="emoji">☕</div>
        <h2>Payload Too Large</h2>
        <p>Your request is too big for us to brew. Try something smaller!</p>
        <div class="actions">
            <a href="javascript:history.back()" class="home-link secondary">← Go Back</a>
            <a href="/" class="home-link primary" onclick="goHome(event)">🏠 Go Home</a>
        </div>
    </div>
    <script>
        function goHome(event) {
            event.preventDefault();
            window.location.href = '/';
        }
    </script>
</body>
</html>
